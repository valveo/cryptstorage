# /etc/fail2ban/filter.d/cryptstorage.conf
# Failed (401) or throttled (429) sign-ins and recoveries against the API, as seen by nginx.
# nginx strips the /api prefix only when proxying, so the access log has /api/...
#
# The log line ends with step=<X-Auth-Step of the API's answer> (roles/ssl, log_format cryptstorage).
# A 401 with step=second-factor is the ordinary first step of every sign-in (right password, the code
# comes next) and is NOT counted; only "step=-" is. Without this, eight people signing in from one
# office address within five minutes got the whole office banned.

[Definition]
failregex = ^<HOST> .* "POST /api/auth/(?:login|recover-e2ee|passkey/begin|passkey/finish) HTTP/[0-9.]+" (?:401|429) .* step=-$
ignoreregex =
