# Weekly proposals for pinned dependencies. Nothing is merged automatically: every proposal runs CI
# and waits for review.
version: 2
updates:
  # Workflow actions are pinned to commit ids; Dependabot keeps the id and the version comment together
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /cryptclient
    schedule:
      interval: weekly

  # Base image digests of the API and web UI images
  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /webui
    schedule:
      interval: weekly

  # Python: security updates only (limit 0 turns version updates off). A change to requirements.txt
  # needs requirements.lock regenerated by hand (the command is in requirements.txt), which CI checks.
  - package-ecosystem: pip
    directory: /api
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
