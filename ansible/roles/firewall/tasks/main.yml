---
# roles/firewall/tasks/main.yml
# UFW firewall: only the required ports open

# Reset only on the first run: a reset every time turns the firewall off for a moment
# and makes every run report a change. Later runs only add the rules below.
- name: Check whether this playbook has set up UFW before
  ansible.builtin.stat:
    path: /etc/ufw/.cryptstorage
  register: ufw_marker

- name: Reset UFW to defaults (first run only)
  community.general.ufw:
    state: reset
  when: not ufw_marker.stat.exists

- name: Set UFW default incoming policy to deny
  community.general.ufw:
    default: deny
    direction: incoming

- name: Set UFW default outgoing policy to allow
  community.general.ufw:
    default: allow
    direction: outgoing

- name: Allow SSH (port 22)
  community.general.ufw:
    rule: allow
    port: '22'
    proto: tcp
    comment: SSH admin access

- name: Allow HTTP (port 80) for Let's Encrypt and redirect
  community.general.ufw:
    rule: allow
    port: '80'
    proto: tcp
    comment: HTTP / Lets Encrypt  # no apostrophe: the ufw module cannot quote it

- name: Allow HTTPS (port 443)
  community.general.ufw:
    rule: allow
    port: '443'
    proto: tcp
    comment: HTTPS web UI

- name: Allow the SFTP service of the encrypted storage
  community.general.ufw:
    rule: allow
    port: "{{ sftp_port | default(2222) }}"
    proto: tcp
    comment: SFTP of the encrypted storage

- name: Enable UFW
  community.general.ufw:
    state: enabled

- name: Remember that UFW is set up
  ansible.builtin.copy:
    dest: /etc/ufw/.cryptstorage
    content: "Firewall rules managed by the CryptStorage playbook (ansible/roles/firewall)\n"
    mode: '0644'

- name: Show UFW status
  ansible.builtin.command: ufw status verbose
  register: ufw_status
  changed_when: false

- name: Print UFW status
  ansible.builtin.debug:
    var: ufw_status.stdout_lines
