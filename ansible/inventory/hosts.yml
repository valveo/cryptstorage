# inventory/hosts.yml
# Change server_ip and domain to your own values

all:
  hosts:
    cryptstorage:
      ansible_host: YOUR_SERVER_IP
      ansible_user: root
      ansible_ssh_private_key_file: ~/.ssh/id_ed25519

  vars:
    # Server domain (Let's Encrypt uses this)
    domain: your-server.example.com

    # Admin e-mail (Let's Encrypt notifications)
    letsencrypt_email: admin@example.com

    # MariaDB passwords - CHANGE THESE
    db_root_password: "CHANGE_ME_db_root"
    db_password: "CHANGE_ME_db_user"

    # JWT secret - CHANGE THIS (min. 32 characters)
    jwt_secret_key: "CHANGE_ME_very_long_random_string_here"

    # gid of the group that may use the daemon socket (default 3000)
    cryptapi_gid: 3000

    # The client encrypts; the server stores ciphertext only (docs/design-e2ee.md).
    # sftp_port: 2222                # public port of the SFTPGo storage service
    # storage_dir: /srv/cryptstorage      # where the users' ciphertext is kept
    # storage_uid: 950               # fixed uid/gid of the system account 'cryptstorage' that owns it (SFTPGo
    # storage_gid: 950               # container, cryptdaemon); unset = a free one picked at install
    # recovery_policy: user          # user | escrow | both (escrow needs escrow_public_key: scripts/escrow.py keygen)
    # escrow_public_key: ""

    # Account protection (docs/design-factors.md)
    # required_factors: "password,totp"   # "password" makes the authenticator app optional (not recommended)
    # change_delay_hours: 24              # wait before a new SSH key or an account deletion takes effect;
    #                                     # the owner gets an e-mail with a cancel link at once

    # Server time zone and locale (optional; default UTC and the image's own locale)
    # server_timezone: Europe/Helsinki
    # server_locale: fi_FI.UTF-8
    # swap_size_mb: 2048               # swap file made when RAM < 2 GB; 0 = never
    # ssh_keys_only: true              # turn off SSH password logins (skipped if ansible_password is set)

    # DEMO SERVER ONLY - leave these out on a real server. demo_account_lifetime_hours DELETES
    # every account and its data that many hours after registration.
    # demo_quota_mb: 1024                # quota of new accounts (default 10240)
    # demo_max_users: 15                 # no registrations beyond this (default 0 = no limit)
    # demo_account_lifetime_hours: 3     # default 0 = accounts are kept

    # Optional client download page https://<domain>/download/: a folder on THIS machine with the
    # client builds (installer, .deb, ...). Refresh with: ansible-playbook ... site.yml --tags downloads
    # client_downloads_src: /home/me/cryptstorage-client

    # Directory of the stack on the server
    install_dir: /opt/cryptstorage

    # Email verification (SMTP)
    # Leave empty if you do not want e-mail verification (development environment)
    smtp_host: "smtp.example.com"
    smtp_port: 587                     # 465 = TLS from the start (smtp_security: ssl, the default on 465)
    smtp_user: "noreply@example.com"
    smtp_password: "CHANGE_ME_smtp_password"
    smtp_from: "noreply@example.com"
    require_email_verification: "true"

    # JWT refresh token lifetime in days
    jwt_refresh_expire_days: 7

    # HMAC key for refresh token hashing - CHANGE THIS
    refresh_token_hmac_key: "CHANGE_ME_refresh_token_hmac_key_32bytes_hex"

    # Key that encrypts the TOTP secrets in the database (64 hex) - CHANGE THIS
    totp_encryption_key: "CHANGE_ME_totp_encryption_key_64_hex"
