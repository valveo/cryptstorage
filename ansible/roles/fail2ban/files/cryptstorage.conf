# /etc/fail2ban/filter.d/cryptstorage.conf
# Failed (401) or throttled (429) logins and mount attempts against the API, as seen by nginx.
# nginx strips the /api prefix only when proxying, so the access log has /api/...

[Definition]
failregex = ^<HOST> .* "POST /api/auth/login HTTP/[0-9.]+" (?:401|429)
            ^<HOST> .* "POST /api/storage/mount HTTP/[0-9.]+" 401
ignoreregex =
