---
# Generate the daemon auth key if it does not exist yet

- name: Check if auth key exists
  ansible.builtin.stat:
    path: /etc/cryptdaemon/auth.key
  register: auth_key_file

- name: Create cryptdaemon config dir
  ansible.builtin.file:
    path: /etc/cryptdaemon
    state: directory
    owner: root
    group: cryptstorage       # the daemon runs as the storage account, not as root
    mode: '0750'

- name: Generate daemon auth key
  ansible.builtin.shell: |
    umask 077
    python3 -c "import os; print(os.urandom(32).hex())" > /etc/cryptdaemon/auth.key
  when: not auth_key_file.stat.exists
  no_log: true

- name: The daemon (storage account) may read the auth key
  ansible.builtin.file:
    path: /etc/cryptdaemon/auth.key
    owner: root
    group: cryptstorage
    mode: '0640'

- name: Read auth key
  ansible.builtin.slurp:
    src: /etc/cryptdaemon/auth.key
  register: auth_key_content
  no_log: true

- name: Set auth key fact
  ansible.builtin.set_fact:
    daemon_auth_key: "{{ auth_key_content.content | b64decode | trim }}"
  no_log: true
