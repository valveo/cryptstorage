name: CI

# The jobs run on GitHub's own Linux machines (free for public repositories). Jobs that need root use
# sudo, which needs no password there (scripts/ci_sudo.sh does nothing then; it is kept for running the
# same jobs on a self-hosted runner). The integration test uses ports of its own.
#
# Pull requests only, not again after the merge: the merged branch was just tested as the pull request's
# merge commit. Each job runs only when the pull request touches what it tests (job `changes`); the
# secret scan always runs. Started by hand (Actions page), every job runs. A pull request from a fork
# runs only after the maintainer approves it (repository setting), and gets a read-only token.
on:
  pull_request:
  workflow_dispatch:

env:
  # sudo on the self-hosted runner asks for the runner account's password (scripts/ci_sudo.sh)
  SUDO_PASSWORD: ${{ secrets.LINUXSERVERSSH }}

# One runner: a newer push to the same branch cancels the run it replaces instead of queueing behind it
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The workflow's token can only read the repository (least privilege before the repository goes public)
permissions:
  contents: read

jobs:
  changes:
    # Which of the jobs below this pull request needs. A change to this file or to the Python
    # requirements runs them all.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.f.outputs.python }}
      go: ${{ steps.f.outputs.go }}
      passkeys: ${{ steps.f.outputs.passkeys }}
      sftpgo: ${{ steps.f.outputs.sftpgo }}
      e2ee: ${{ steps.f.outputs.e2ee }}
      install: ${{ steps.f.outputs.install }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: f
        name: What this pull request touches
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE" ]; then
            files=$(git diff --name-only "$BASE" HEAD)
          else
            files=.github/workflows/ci.yml # started by hand: everything
          fi
          echo "$files"
          all=false
          grep -qE '^(\.github/workflows/ci\.yml|requirements[^/]*\.txt|pytest\.ini)$' <<<"$files" && all=true
          has() { $all || grep -qE "$1" <<<"$files"; }
          # Python: the API, daemon, web UI and their tests; everything except the client, docs and Ansible
          if $all || grep -vqE '^(cryptclient/|docs/|ansible/|[^/]*\.md$|\.github/workflows/windows)' <<<"$files"; then
            echo python=true >>"$GITHUB_OUTPUT"
          fi
          has '^cryptclient/' && echo go=true >>"$GITHUB_OUTPUT"
          has '^(api/|webui/|tests/browser/|cryptclient/)' && echo passkeys=true >>"$GITHUB_OUTPUT"
          has '^(ansible/|cryptdaemon/|scripts/(sftpgo_container_test|install_sftpgo)\.sh$)' && echo sftpgo=true >>"$GITHUB_OUTPUT"
          has '^(api/|cryptdaemon/|cryptclient/|webui/assets/|scripts/)' && echo e2ee=true >>"$GITHUB_OUTPUT"
          has '^(install\.sh$|ansible/|scripts/|api/|cryptdaemon/|webui/)' && echo install=true >>"$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  python:
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # The API's dependencies exactly as the image installs them: every package, also the indirect
      # ones, at a fixed version and checked against its hash (api/requirements.lock)
      - run: pip install --require-hashes -r api/requirements.lock
      - run: pip install -r requirements-dev.txt
      - name: The lock file matches requirements.txt
        run: |
          pip install uv==0.13.7
          cd api && uv pip compile requirements.txt --universal --python-version 3.11 --generate-hashes \
            --no-header --no-annotate -q -o requirements.lock
          git diff --exit-code -- requirements.lock || {
            echo "::error::api/requirements.lock is out of date: run the command in api/requirements.txt and commit the result"; exit 1; }
      - name: SFTPGo (pinned release; the daemon's client is tested against the real server)
        # already there on the self-hosted runner (it is the test server's version): no sudo needed then
        run: sftpgo --version 2>/dev/null | grep -qi "^sftpgo 2.7.6" || sudo scripts/install_sftpgo.sh
      - name: Static analysis (undefined names, bad imports)
        run: python -m pyflakes api cryptdaemon tests
      - name: Tests (unit, API <-> daemon smoke test, web UI against a stub API)
        run: python -m pytest -q
      - name: Known vulnerabilities in the dependencies, the indirect ones included
        run: pip install pip-audit && pip-audit -r api/requirements.lock --require-hashes --disable-pip

  go:
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cryptclient
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: cryptclient/go.mod
      # go.sum is committed: fail when go.mod or go.sum would change, instead of fixing them silently
      - run: go mod tidy -diff
      - run: go vet ./...
      - run: go test ./...
      - name: Cross-compile
        run: |
          for os in linux windows darwin; do
            GOOS=$os CGO_ENABLED=0 go build -o /dev/null .
          done
      # Fails the build: it reports only vulnerabilities in code the client actually calls. One in the Go
      # standard library is fixed by raising the "toolchain" line in go.mod, which is also the Go the
      # releases are built with.
      - name: Known vulnerabilities (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  secrets:
    # Secret scan of the tree and the history of this commit (gitleaks, pinned release; fixtures in .gitleaks.toml).
    # Only HEAD's history: --all also scanned other PRs' branches left in the self-hosted runner's
    # workspace, so one PR's finding failed every PR. Each branch is still scanned by its own run.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    # A scan takes seconds; a stuck one held the test server for minutes (2026-10-29)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          T=$(mktemp -d)
          curl -fsSL -o $T/gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  $T/gl.tgz" | sha256sum -c -
          tar -xzf $T/gl.tgz -C $T gitleaks
          # Only the history: every commit's changes, so the tree at HEAD too. A directory scan also read
          # the git packs and whatever earlier jobs left in the self-hosted workspace, and could hang the
          # test server (2026-10-29)
          nice -n 10 $T/gitleaks git . --no-banner --redact --max-target-megabytes 5 --log-opts="HEAD"

  passkeys-browser:
    # Passkeys end to end: real API, PHP web UI, Chromium's virtual authenticator, the app's sign-in
    needs: changes
    if: ${{ needs.changes.outputs.passkeys == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: scripts/ci_sudo.sh
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: cryptclient/go.mod
      - run: pip install -r requirements-dev.txt
      - run: php -m 2>/dev/null | grep -qx mbstring || (sudo apt-get -o DPkg::Lock::Timeout=600 update && sudo apt-get -o DPkg::Lock::Timeout=600 install -y php-cli php-mbstring)
      - name: Playwright with Chromium
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm install playwright@1.63.0 >/dev/null
          npx playwright install --with-deps chromium
      - name: Browser test
        run: NODE_PATH=/tmp/pw/node_modules tests/browser/run.sh

  sftpgo-container:
    # The SFTPGo container of the Ansible stack with the role's own tasks: user creation, login with the
    # pinned host key, restart and restore
    needs: changes
    if: ${{ needs.changes.outputs.sftpgo == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: scripts/ci_sudo.sh
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt ansible-core
      # the test server is a plain Ubuntu: docker comes from the distribution the first time
      - name: Docker with compose
        run: |
          docker compose version >/dev/null 2>&1 && exit 0
          sudo apt-get -o DPkg::Lock::Timeout=600 update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=600 install -y -qq docker.io docker-compose-v2
          sudo systemctl enable --now docker
          sudo docker compose version
          if ss -ltn | grep -q ':8081 '; then echo "port 8081 is taken on this machine"; ss -ltnp | grep ':8081 '; exit 1; fi
      - name: Container test
        run: sudo env "PATH=$PATH" "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}" PYTHONDONTWRITEBYTECODE=1 SFTP_PORT=12223 scripts/sftpgo_container_test.sh

  e2ee:
    # The whole encrypted-storage flow with the real parts: API, SFTPGo, sshfs, gocryptfs
    needs: changes
    if: ${{ needs.changes.outputs.e2ee == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: scripts/ci_sudo.sh
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: cryptclient/go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - run: sudo apt-get -o DPkg::Lock::Timeout=600 update && sudo apt-get -o DPkg::Lock::Timeout=600 install -y gocryptfs sshfs fuse3
      - run: pip install -r requirements-dev.txt
      - run: cd cryptclient && go mod tidy
      - name: The browser derives the same login key as the Go client
        run: node webui/assets/derive.test.mjs
      - name: Integration test
        # ports of its own: the test server's API (8099) and SFTPGo keep running beside it. LD_LIBRARY_PATH:
        # the Python of setup-python does not start without it, and sudo drops it
        run: sudo env "PATH=$PATH" "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}" PYTHONDONTWRITEBYTECODE=1 PORT_API=18099 PORT_SFTP=12222 SFTPGO_API_PORT=18089 scripts/e2ee_integration.sh

  install:
    # A real installation on a fresh machine with install.sh (the whole playbook: firewall, Docker,
    # the stack, nginx with a self-signed certificate), then two real updates with
    # cryptstorage-update from release packages built here. Only on GitHub's throwaway machines:
    # it takes the machine over.
    needs: changes
    if: ${{ needs.changes.outputs.install == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DOMAIN: cryptstorage.test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Refuse to run anywhere but on a hosted runner
        run: '[ "$RUNNER_ENVIRONMENT" = github-hosted ]'
      - name: The name of the server points here
        run: echo "127.0.0.1 $DOMAIN" | sudo tee -a /etc/hosts
      - name: Preflight only
        run: sudo ./install.sh --check
      - name: Install
        run: sudo ./install.sh --yes --domain "$DOMAIN" --email admin@example.com --tls selfsigned --no-smtp
      - name: The server answers and the commands are there
        run: |
          set -x
          curl -fsS -k "https://$DOMAIN/api/health" | tee /tmp/health.json
          grep -qF "\"version\":\"$(sudo cat /etc/cryptstorage/installed-version)\"" /tmp/health.json
          curl -fsS -k -o /dev/null "https://$DOMAIN/"
          curl -fsS -o /dev/null -w '%{http_code}\n' "http://$DOMAIN/" | grep -qx 301
          sudo cat /etc/cryptstorage/installed-version
          sudo stat -c '%a %U' /etc/cryptstorage/inventory.yml | grep -qx '600 root'
          sudo ufw status | grep -q 'Status: active'
          sudo cryptstorage-admin users
          sudo cryptstorage-update --help | grep -q -- --full
      - name: An account to carry through the updates
        run: |
          curl -fsS -k -H 'Content-Type: application/json' -X POST "https://$DOMAIN/api/auth/register" \
            -d '{"username": "citest", "email": "citest@example.com", "password": "a long test password 42"}'
          sudo cryptstorage-admin users | grep -q '^citest '
      - name: A second run changes no settings
        run: |
          sudo sha256sum /etc/cryptstorage/inventory.yml > /tmp/inventory.sum
          sudo ./install.sh --yes
          sudo sha256sum -c /tmp/inventory.sum
          sudo cryptstorage-admin users | grep -q '^citest '
      - name: Two release packages
        run: |
          for v in 99.0.0 99.0.1; do
            scripts/server-package.sh "$v" "/tmp/releases/v$v"
            ( cd "/tmp/releases/v$v" && sha256sum -- * > SHA256SUMS )
          done
      - name: Without cosign the update stops before touching anything
        run: |
          if sudo env "CRYPTSTORAGE_RELEASES=file:///tmp/releases" cryptstorage-update --yes --version 99.0.0; then exit 1; fi
          sudo test ! -e /var/backups/cryptstorage
      - name: Update (backup of what the upgrade changes)
        run: |
          sudo env "CRYPTSTORAGE_RELEASES=file:///tmp/releases" cryptstorage-update --yes --version 99.0.0 --no-signature-check
          curl -fsS -k "https://$DOMAIN/api/health" | grep -F '"version":"99.0.0 ('
          sudo sh -c 'ls -d /var/backups/cryptstorage/*-without-files'
          sudo sh -c 'cd /var/backups/cryptstorage/*-without-files && sha256sum -c SHA256SUMS && test -s db.sql.gz && test -s settings.tar.gz && test ! -e storage.tar.gz'
          sudo cryptstorage-admin users | grep -q '^citest '
      - name: The same version again is nothing to do, an older one is refused
        run: |
          sudo env "CRYPTSTORAGE_RELEASES=file:///tmp/releases" cryptstorage-update --yes --version 99.0.0 --no-signature-check | grep -q 'Nothing to do'
          if sudo cryptstorage-update --yes --version 0.1.0 --no-signature-check; then exit 1; fi
      - name: Update with --full (complete backup)
        run: |
          sudo env "CRYPTSTORAGE_RELEASES=file:///tmp/releases" cryptstorage-update --yes --version 99.0.1 --no-signature-check --full --backup-dir /srv/backups
          curl -fsS -k "https://$DOMAIN/api/health" | grep -F '"version":"99.0.1 ('
          sudo sh -c 'cd /srv/backups/cryptstorage-* && sha256sum -c SHA256SUMS && test -s storage.tar.gz && test ! -e WITHOUT-FILES.txt'
          sudo cryptstorage-admin users | grep -q '^citest '
      - name: What the server says when something failed
        if: failure()
        run: |
          sudo docker ps -a || true
          sudo docker compose -f /opt/cryptstorage/docker-compose.yml logs --tail 80 || true
          sudo journalctl -u cryptdaemon -n 50 --no-pager || true
          sudo nginx -t || true

