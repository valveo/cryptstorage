---
# roles/cryptdaemon/tasks/account.yml
# The storage service (the SFTPGo container) and cryptdaemon run as their own system account "cryptstorage",
# which owns the users' ciphertext and nothing else (no login, no home). The system picks a free uid
# and gid at the first install; set storage_uid / storage_gid to fix them, e.g. for several servers
# sharing one storage. The numbers are read back on every run as the facts storage_account_uid and
# storage_account_gid (the container, the daemon's unit and the ownership checks need the number).

- name: Group of the storage service
  ansible.builtin.group:
    name: cryptstorage
    gid: "{{ storage_gid | default(omit) }}"
    system: true

- name: Account of the storage service
  ansible.builtin.user:
    name: cryptstorage
    uid: "{{ storage_uid | default(omit) }}"
    group: cryptstorage
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    home: /nonexistent

- name: Read the uid and gid of the storage account
  ansible.builtin.getent:
    database: passwd
    key: cryptstorage

- name: Remember them
  ansible.builtin.set_fact:
    storage_account_uid: "{{ ansible_facts.getent_passwd.cryptstorage[1] | int }}"
    storage_account_gid: "{{ ansible_facts.getent_passwd.cryptstorage[2] | int }}"
