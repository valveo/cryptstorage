name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing CryptStorage. **Do not paste passwords, recovery codes, keys or tokens.**
        Security problems go to the private report form instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. cryptclient setup
        2. ...
  - type: dropdown
    id: part
    attributes:
      label: Which part
      options:
        - Client on Linux
        - Client on Windows
        - Client on macOS
        - Server install (Ansible)
        - Web interface
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `cryptclient version`, or the release / commit you installed.
  - type: textarea
    id: logs
    attributes:
      label: Output or logs
      description: Remove anything private before pasting.
      render: text
